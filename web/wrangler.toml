# Static hosting for the client. Cloudflare now steers new projects to Workers
# static assets rather than Pages; both are free for a site this size.
name = "indiscreet-chess"
compatibility_date = "2026-01-01"

# The real address. Wrangler creates the DNS record and certificate on deploy,
# because the continuous-chess.com zone is in this Cloudflare account.
# These must stay above [assets]: below it they become asset options and are
# ignored with only a warning.
routes = [{ pattern = "continuous-chess.com", custom_domain = true }]
# Setting routes turns the workers.dev address off unless asked. It stays on:
# players' local history and settings live in that origin's storage.
workers_dev = true

[assets]
directory = "./dist"
